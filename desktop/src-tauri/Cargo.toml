[package]
name = "cozmo-desktop"
version = "0.1.0"
description = "Cozmo desktop shell (Tauri) wrapping the Cozmo WebUI"
authors = ["Cozmo"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"

[profile.release]
lto = true
strip = true
codegen-units = 1
