name: Release

# Releases are cut by pushing a tag, never by merging. Every merge to main
# publishing an installer would ship to testers, including the merges made
# while trying to fix something.
on:
  push:
    # Deliberately narrow: NOT `v*`. This repo already carries unrelated
    # historical tags (`v3-runtime-stabilized`, and a `0.4.0-product-foundation`
    # whose semver sorts *above* the beta line). Under `v*` any of them
    # triggers this job, `release.py` accepts it as a well-formed version, and
    # the result is published as /releases/latest -- which the in-app updater
    # reads, so pushing a stale tag would push unrelated code to every
    # installed client. This pattern matches only real x.y.z release tags and
    # does not match `v3-runtime-stabilized`.
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

# Two releases must never race to own /releases/latest. `cancel-in-progress:
# false` queues the second run instead of killing the first, so an in-flight
# publish finishes rather than being cancelled halfway through.
concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish installer
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: novi/webui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      # The value arrives through `env:` rather than being substituted into
      # the script body. A git ref may legally contain `"`, `;`, `$()` and
      # backticks (only spaces are forbidden), so inlining `${{ github.ref_name }}`
      # inside a quoted PowerShell string is a script injection: the tag
      # `v0.3.0";calc` closes the string and runs the rest. Tag pushes already
      # require write access, but this repo is public and the fix is free.
      - name: Derive version
        id: version
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:REF_NAME.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+') {
            throw "Version '$version' must start with MAJOR.MINOR.PATCH, e.g. 0.3.0-beta.1"
          }
          # Heredoc form, not a plain single-line append to GITHUB_OUTPUT.
          # The guard above is a PREFIX match (`^\d+\.\d+\.\d+`), so a value
          # like `0.3.0-x` followed by a newline and attacker-chosen text
          # passes validation; with plain appending that newline starts a
          # second output line and the step can inject arbitrary step outputs
          # (including into later `with:` blocks). The delimiter form keeps a
          # multi-line value inside one output.
          $delimiter = "EOF_$(New-Guid)"
          @"
          version=$version
          $delimiter
          "@ >> $env:GITHUB_OUTPUT
          Write-Host "Releasing version $version"

      # `set` writes all six manifests and `check` re-reads all six, so a tag
      # that is well-formed enough to pass the regex above but still malformed
      # (e.g. 1.2.3- with an empty pre-release) fails here -- before PyInstaller,
      # before tauri build, before anything is published.
      - name: Sync version across manifests
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python scripts/release.py set "$env:VERSION"

      - name: Verify no version skew
        run: python scripts/release.py check

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip; python -m pip install -e .[desktop-build]

      - name: Install frontend dependencies
        run: npm --prefix novi/webui ci

      - name: Build the desktop backend sidecar
        # Must run before tauri build: bundle.resources picks up whatever is in
        # src-tauri/resources, and a build without this produces an installer
        # that dies at runtime with "This Novi release is missing its bundled
        # backend".
        run: python scripts/build_desktop_backend.py

      - name: Confirm the sidecar is present
        shell: pwsh
        run: |
          $sidecar = "novi/webui/src-tauri/resources/novi-backend.exe"
          if (-not (Test-Path $sidecar)) {
            throw "Backend sidecar was not built - refusing to publish a broken installer"
          }
          $size = (Get-Item $sidecar).Length
          Write-Host "sidecar present: $([math]::Round($size / 1MB, 1)) MB"
          # The Test-Path above is the real guard: build_desktop_backend.py
          # already exits non-zero on PyInstaller failure and raises if the
          # artifact is missing, so the job never reaches this step without a
          # sidecar. The size floor below is a secondary sanity check on a
          # truncated-but-present artifact - it is not what makes this step
          # safe, and a legitimately small backend would fail here.
          if ($size -lt 1MB) {
            throw "Backend sidecar is implausibly small ($size bytes) - PyInstaller likely truncated"
          }

      # Pinned to a commit SHA, not a floating tag. This step receives
      # `contents: write` AND the minisign private key, so a moved tag is a
      # compromised release pipeline able to sign arbitrary installers. v0.6.2
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          # The minisign private key proves an update genuinely came from Novi.
          # It is NOT an Authenticode certificate and does not remove the
          # SmartScreen warning - those are separate trust systems.
          #
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD is deliberately absent, not set
          # to "". The key has no password (`tauri signer sign` prints
          # "Signing without password."), and Tauri branches on
          # `env::var(..).ok()` -- `Some("")` and `None` take different paths.
          # GitHub resolves a missing secret to the empty string, so
          # referencing one here would set it to "" and diverge from the
          # locally verified working state.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          # The Tauri CLI looks for tauri.conf.json by walking up from the
          # working directory, which on a runner is the repo root. Root has no
          # package.json and no src-tauri/, and novi/webui/src-tauri is depth 4 -
          # past the default max depth of 3 - so without this the CLI aborts
          # with "Couldn't recognize the current folder as a Tauri project" and
          # the job fails before anything is published. Every documented local
          # build runs from novi/webui, which is why this only breaks in CI.
          projectPath: novi/webui
          tagName: v${{ steps.version.outputs.version }}
          releaseName: "Novi ${{ steps.version.outputs.version }}"
          releaseBody: |
            Windows x64 beta installer.

            Novi is unsigned. Windows SmartScreen will show "Windows protected
            your PC" on first run. Choose **More info → Run anyway**.

            **Ollama must be installed separately before Novi will work.**
            This build does not bundle it and does not offer to download it --
            install Ollama from https://ollama.com and make sure `ollama serve`
            is running, then start Novi. Automated first-run provisioning
            (downloading and configuring Ollama for you) arrives in a later
            release.

            Novi also downloads an embedding model on first launch if one is
            not already present, so allow a little time on the very first run.
          releaseDraft: false
          # Deliberately NOT a GitHub prerelease. The updater endpoint
          # (releases/latest/download/latest.json) excludes prereleases, so
          # marking this as a prerelease would break automatic updates.
          prerelease: false
          args: --bundles nsis

      # The whole point of `prerelease: false` is that latest.json must be
      # reachable at releases/latest/download/latest.json. Nothing above
      # asserts that happened, so an absent updater artifact would only
      # surface later as a silent 404 inside someone's installed app. Verify
      # it here, loudly, while the run is still visible.
      - name: Verify the release carries the updater manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ steps.version.outputs.version }}
        run: |
          $assets = gh release view $env:RELEASE_TAG --json assets | ConvertFrom-Json | Select-Object -ExpandProperty assets | Select-Object -ExpandProperty name
          Write-Host "release assets: $($assets -join ', ')"
          if ($assets -notcontains "latest.json") {
            throw "Release $($env:RELEASE_TAG) has no latest.json asset, so every updater client will 404 on the next release. Expected bundle.createUpdaterArtifacts (Task 3) and TAURI_SIGNING_PRIVATE_KEY to be in place. Assets found: $($assets -join ', ')"
          }
