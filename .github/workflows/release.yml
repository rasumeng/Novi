name: Release

# Releases are cut by pushing a tag, never by merging. Every merge to main
# publishing an installer would ship to testers, including the merges made
# while trying to fix something.
on:
  push:
    # Deliberately narrow: NOT `v*`. This repo already carries unrelated
    # historical tags (`v3-runtime-stabilized`, and a `0.4.0-product-foundation`
    # whose semver sorts *above* the beta line). Under `v*` any of them
    # triggers this job, `release.py` accepts it as a well-formed version, and
    # the result is published as /releases/latest -- which the in-app updater
    # reads, so pushing a stale tag would push unrelated code to every
    # installed client.
    #
    # These patterns are a coarse first filter, NOT the invariant. They cannot
    # be: GitHub's filter-pattern language has no notion of "the suffix must be
    # exactly -beta.N", so a foreign tag that looks version-shaped can match.
    # The invariants are enforced in the job body: the release-line regex in
    # "Derive version" and, decisively, the ancestry guard immediately after it
    # (a tagged commit that is not on origin/main is refused no matter how the
    # tag is spelled). Do not treat this list as "only real release tags".
    #
    # One explicit pattern per release line, no stacked quantifiers. GitHub
    # defines `*` as "zero or more of the *preceding character*" and `+` as
    # "one or more of the preceding character", and does not define stacked
    # quantifiers like `[0-9]+*` -- so those are excluded here. Each `*`/`?`
    # below applies to exactly one preceding character class.
    #
    # The beta line is the one that must match today (`v0.3.0-beta.1`). The
    # plain `vX.Y.Z` line is here so a stable release needs no workflow edit --
    # note it also matches nothing historical, but it *is* looser than the beta
    # line, and that is acceptable precisely because the ancestry guard rejects
    # any tag not on origin/main regardless of spelling.
    tags:
      - "v[0-9].[0-9].[0-9]-beta.[0-9]*"
      - "v[0-9].[0-9].[0-9]"

permissions:
  contents: write

# Two releases must never race to own /releases/latest. `cancel-in-progress:
# false` queues the second run instead of killing the first, so an in-flight
# publish finishes rather than being cancelled halfway through.
concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish installer
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      # fetch-depth: 0 is required, not cosmetic: the ancestry guard below runs
      # `git merge-base --is-ancestor <sha> origin/main`, and the default
      # shallow clone (depth 1) has no ancestry to walk -- the merge base is
      # unknown and the check would fail, or pass, for the wrong reason.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: novi/webui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      # The value arrives through `env:` rather than being substituted into
      # the script body. A git ref may legally contain `"`, `;`, `$()` and
      # backticks (only spaces are forbidden), so inlining `${{ github.ref_name }}`
      # inside a quoted PowerShell string is a script injection: the tag
      # `v0.3.0";calc` closes the string and runs the rest. Tag pushes already
      # require write access, but this repo is public and the fix is free.
      - name: Derive version
        id: version
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:REF_NAME.TrimStart('v')
          # FULL match, not the old prefix match `^\d+\.\d+\.\d+`. Anchored at
          # both ends with \A...\z so nothing -- including a trailing newline
          # followed by more text -- can ride along past the check. This is the
          # project's release line: MAJOR.MINOR.PATCH with an optional
          # `-beta.N` pre-release. It rejects well-formed-looking foreign tags
          # such as `v0.4.0-product-foundation` and `v0.2.0-beta`, which the
          # old prefix match happily accepted.
          if ($version -notmatch '\A\d+\.\d+\.\d+(-beta\.\d+)?\z') {
            throw "Tag '$($env:REF_NAME)' is not a Novi release tag. This project publishes only MAJOR.MINOR.PATCH-beta.N (e.g. v0.3.0-beta.1) or a plain MAJOR.MINOR.PATCH (e.g. v0.3.0); historical tags like v0.4.0-product-foundation and v3-runtime-stabilized are NOT releasable. Nothing was published and no irreversible action happened. The tag already exists on the remote, so delete it and push the correct one: git tag -d '$($env:REF_NAME)'; git push origin :refs/tags/$($env:REF_NAME)"
          }
          # The heredoc form, not a plain single-line append to GITHUB_OUTPUT.
          # It costs nothing and removes any dependence on the validation above
          # being airtight: a value carrying a newline would start a second
          # output line and the step could inject arbitrary step outputs
          # (including into later `with:` blocks). The heredoc form below is
          # what prevents OUTPUT INJECTION.
          #
          # Two things are easy to get wrong here and both have broken real
          # release workflows:
          #
          # 1. The heredoc opener is `version<<DELIMITER` -- the `<<` is
          #    required. Writing `version=VALUE` followed by the delimiter
          #    produces a plain single-line append, which is exactly the
          #    injectable form the delimiter was added to avoid.
          # 2. Do NOT use the PowerShell `>>` redirection operator to write it.
          #    On a Windows `pwsh` runner `>>` appends UTF-16-LE *with a BOM*
          #    and CRLF endings; GitHub's parser requires UTF-8 and reads the
          #    BOM and \r as part of the value, failing the job with
          #    "Invalid format 'EOF_...'".
          $delimiter = "EOF_$(New-Guid)"
          $payload = "version<<$delimiter`n$version`n$delimiter`n"
          [System.IO.File]::WriteAllText($env:GITHUB_OUTPUT, $payload, (New-Object System.Text.UTF8Encoding $false))
          Write-Host "Releasing version $version"

      # The deterministic guard. Everything above is a spelling check and can
      # only ever be as good as the patterns someone chose; this one is a fact
      # about git: is the tagged commit actually on origin/main? If not, the tag
      # points at foreign history and no amount of tag-shaped syntax makes it
      # releasable -- it is rejected however it is spelled, which is what
      # actually closes the hole left by the coarse tag filter above.
      #
      # Placed here, before pip install / PyInstaller / tauri build, so a bad
      # tag fails in seconds instead of after a 30+ minute build. The operator
      # has already run an irreversible `git push`, so the message must tell
      # them exactly what to undo.
      - name: Refuse tags that are not on origin/main
        shell: pwsh
        env:
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git fetch --no-tags --quiet origin main
          git merge-base --is-ancestor $env:SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Tag '$($env:REF_NAME)' points at commit $($env:SHA), which is NOT an ancestor of origin/main. That commit is not part of this project's main line, so publishing it would push unrelated code to every installed client via /releases/latest. Nothing was built or published. The tag is already on the remote: delete it and push a tag on a main-line commit instead -- git tag -d '$($env:REF_NAME)'; git push origin :refs/tags/$($env:REF_NAME); git tag <correct-tag>; git push origin <correct-tag>"
          }
          Write-Host "commit $($env:SHA) is on origin/main - ancestry OK"

      # `set` writes all six manifests and `check` re-reads all six, so a tag
      # that is well-formed enough to pass the regex above but still malformed
      # (e.g. 1.2.3- with an empty pre-release) fails here -- before PyInstaller,
      # before tauri build, before anything is published.
      - name: Sync version across manifests
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python scripts/release.py set "$env:VERSION"

      - name: Verify no version skew
        run: python scripts/release.py check

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip; python -m pip install -e .[desktop-build]

      - name: Install frontend dependencies
        run: npm --prefix novi/webui ci

      - name: Build the desktop backend sidecar
        # Must run before tauri build: bundle.resources picks up whatever is in
        # src-tauri/resources, and a build without this produces an installer
        # that dies at runtime with "This Novi release is missing its bundled
        # backend".
        run: python scripts/build_desktop_backend.py

      - name: Confirm the sidecar is present
        shell: pwsh
        run: |
          $sidecar = "novi/webui/src-tauri/resources/novi-backend.exe"
          if (-not (Test-Path $sidecar)) {
            throw "Backend sidecar was not built - refusing to publish a broken installer"
          }
          $size = (Get-Item $sidecar).Length
          Write-Host "sidecar present: $([math]::Round($size / 1MB, 1)) MB"
          # The Test-Path above is the real guard: build_desktop_backend.py
          # already exits non-zero on PyInstaller failure and raises if the
          # artifact is missing, so the job never reaches this step without a
          # sidecar. The size floor below is a secondary sanity check on a
          # truncated-but-present artifact - it is not what makes this step
          # safe, and a legitimately small backend would fail here.
          if ($size -lt 1MB) {
            throw "Backend sidecar is implausibly small ($size bytes) - PyInstaller likely truncated"
          }

      # Pinned to a commit SHA, not a floating tag. This step receives
      # `contents: write` AND the minisign private key, so a moved tag is a
      # compromised release pipeline able to sign arbitrary installers. v0.6.2
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The minisign private key proves an update genuinely came from Novi.
          # It is NOT an Authenticode certificate and does not remove the
          # SmartScreen warning - those are separate trust systems.
          #
          # This keypair was generated with a password. Both values must be
          # present: omitting the password makes Tauri fail only after it has
          # spent several minutes building the installer.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # The Tauri CLI looks for tauri.conf.json by walking up from the
          # working directory, which on a runner is the repo root. Root has no
          # package.json and no src-tauri/, and novi/webui/src-tauri is depth 4 -
          # past the default max depth of 3 - so without this the CLI aborts
          # with "Couldn't recognize the current folder as a Tauri project" and
          # the job fails before anything is published. Every documented local
          # build runs from novi/webui, which is why this only breaks in CI.
          projectPath: novi/webui
          tagName: v${{ steps.version.outputs.version }}
          releaseName: "Novi ${{ steps.version.outputs.version }}"
          releaseBody: |
            Windows x64 beta installer.

            Novi is unsigned. Windows SmartScreen will show "Windows protected
            your PC" on first run. Choose **More info → Run anyway**.

            **Ollama must be installed separately before Novi will work.**
            This build does not bundle it and does not offer to download it --
            install Ollama from https://ollama.com and make sure `ollama serve`
            is running, then start Novi. Automated first-run provisioning
            (downloading and configuring Ollama for you) arrives in a later
            release.

            Novi also downloads an embedding model on first launch if one is
            not already present, so allow a little time on the very first run.
          releaseDraft: false
          # Deliberately NOT a GitHub prerelease. The updater endpoint
          # (releases/latest/download/latest.json) excludes prereleases, so
          # marking this as a prerelease would break automatic updates.
          prerelease: false
          args: --bundles nsis

      # The whole point of `prerelease: false` is that latest.json must be
      # reachable at releases/latest/download/latest.json. Nothing above
      # asserts that happened, so an absent updater artifact would only
      # surface later as a silent 404 inside someone's installed app. Verify
      # it here, loudly, while the run is still visible.
      - name: Verify the release carries the updater manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ steps.version.outputs.version }}
        run: |
          $assets = gh release view $env:RELEASE_TAG --json assets | ConvertFrom-Json | Select-Object -ExpandProperty assets | Select-Object -ExpandProperty name
          Write-Host "release assets: $($assets -join ', ')"
          if ($assets -notcontains "latest.json") {
            throw "Release $($env:RELEASE_TAG) has no latest.json asset, so every updater client will 404 on the next release. Expected bundle.createUpdaterArtifacts (Task 3) and TAURI_SIGNING_PRIVATE_KEY to be in place. Assets found: $($assets -join ', ')"
          }
