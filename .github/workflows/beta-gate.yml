name: Beta gate

on:
  pull_request:
  push:
    branches: [main, beta]

permissions:
  contents: read

jobs:
  verify:
    name: Verify desktop beta
    runs-on: windows-latest
    # The python suite alone runs ~25-40 min on a cold Windows runner: the
    # TestClient-based tests boot the whole app (models, brain, scheduler) per
    # test. verify_beta.py runs pytest twice, plus tsc, a Vite build and
    # vitest. Adding `cargo test` (two cold Rust builds with no cache before
    # rust-cache was added) puts a realistic total at 65-80 min, which the
    # previous 60-minute cap would have killed. Matches release.yml.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: novi/webui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      # Without this, `cargo check` and `cargo test` each compile the crate
      # graph from scratch on every run. Float on a major version on purpose:
      # Cargo.lock pins the dependency graph and only the compiler moves.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: novi/webui/src-tauri
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip; python -m pip install -e .[test]
      - name: Install frontend dependencies
        run: npm --prefix novi/webui ci --loglevel verbose
      - name: Run beta verification gate
        # --timeout bounds an individual hung test instead of letting it burn
        # the whole job budget; pytest-timeout ships in the [test] extra.
        run: python scripts/verify_beta.py
      - name: Check desktop shell
        run: cargo check --manifest-path novi/webui/src-tauri/Cargo.toml
      - name: Test desktop shell
        # Phases 2 and 3 of the beta distribution plan put most of their new
        # logic in Rust. Without this step that logic ships untested, which
        # contradicts the position taken in docs/RISK_AUDIT.md that the test
        # suite is the part of this codebase that can be trusted.
        run: cargo test --manifest-path novi/webui/src-tauri/Cargo.toml
