name: Beta gate

on:
  pull_request:
  push:
    branches: [main, beta]

permissions:
  contents: read

jobs:
  verify:
    name: Verify desktop beta
    runs-on: windows-latest
    # The python suite alone runs ~25-40 min on a cold Windows runner: the
    # TestClient-based tests boot the whole app (models, brain, scheduler) per
    # test. The previous 20-minute cap killed the job before it could report.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: novi/webui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip; python -m pip install -e .[test]
      - name: Install frontend dependencies
        run: npm --prefix novi/webui ci
      - name: Run beta verification gate
        # --timeout bounds an individual hung test instead of letting it burn
        # the whole job budget; pytest-timeout ships in the [test] extra.
        run: python scripts/verify_beta.py
      - name: Check desktop shell
        run: cargo check --manifest-path novi/webui/src-tauri/Cargo.toml
      - name: Test desktop shell
        # Phases 2 and 3 of the beta distribution plan put most of their new
        # logic in Rust. Without this step that logic ships untested, which
        # contradicts the position taken in docs/RISK_AUDIT.md that the test
        # suite is the part of this codebase that can be trusted.
        run: cargo test --manifest-path novi/webui/src-tauri/Cargo.toml
