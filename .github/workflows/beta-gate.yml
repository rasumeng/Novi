name: Beta gate

on:
  pull_request:
  push:
    branches: [main, beta]

permissions:
  contents: read

jobs:
  verify:
    name: Verify desktop beta
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: novi/webui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip; python -m pip install -e .[test]
      - name: Install frontend dependencies
        run: npm --prefix novi/webui ci
      - name: Run beta verification gate
        run: python scripts/verify_beta.py
      - name: Check desktop shell
        run: cargo check --manifest-path novi/webui/src-tauri/Cargo.toml
