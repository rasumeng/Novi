<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Novi — AI Agent</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>✦</text></svg>">
    <style>
      :root { color-scheme: dark; } html, body, #root { margin: 0; width: 100%; height: 100%; background: #131418; color: #f3f2f7; }
      .novi-boot { min-height: 100%; box-sizing: border-box; display: grid; place-items: center; padding: 32px; background: radial-gradient(circle at 50% 42%, #25223d 0, #17181f 39%, #111216 100%); color: #f3f2f7; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }.novi-boot__card { width: min(100%, 440px); padding: 32px; box-sizing: border-box; border: 1px solid rgba(255,255,255,.09); border-radius: 20px; background: rgba(25,26,33,.84); box-shadow: 0 22px 64px rgba(0,0,0,.32); text-align: left; }.novi-boot__brand { display: flex; align-items: center; gap: 10px; margin-bottom: 30px; color: #bcb7ff; font-size: 11px; font-weight: 700; letter-spacing: .13em; }.novi-boot__mark { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 8px; background: #7a6ee0; color: white; font-size: 16px; letter-spacing: 0; }.novi-boot__heading { display: flex; align-items: center; gap: 13px; }.novi-boot__spinner { width: 26px; height: 26px; box-sizing: border-box; flex: none; border: 3px solid rgba(142,130,255,.24); border-top-color: #a99fff; border-radius: 50%; animation: novi-boot-spin .85s linear infinite; }.novi-boot h1 { margin: 0; font-size: 22px; line-height: 1.2; letter-spacing: -.025em; }.novi-boot__status { min-height: 22px; margin: 10px 0 25px; color: #b4b5be; font-size: 14px; line-height: 1.55; }.novi-boot__progress { height: 4px; overflow: hidden; border-radius: 99px; background: #30313a; }.novi-boot__progress::after { content: ""; display: block; width: 42%; height: 100%; border-radius: inherit; background: linear-gradient(90deg,#7368dd,#b3aaff,#7368dd); animation: novi-boot-move 1.65s ease-in-out infinite; }.novi-boot__steps { display: grid; gap: 13px; margin: 25px 0 0; padding: 0; list-style: none; }.novi-boot__steps li { display: flex; align-items: center; gap: 10px; color: #777983; font-size: 13px; transition: color .28s ease; }.novi-boot__dot { display: block; width: 7px; height: 7px; border-radius: 50%; background: #4a4b54; transition: background .28s ease, box-shadow .28s ease; }.novi-boot__steps li.active { color: #dcdaeb; }.novi-boot__steps li.active .novi-boot__dot { background: #9c91ff; box-shadow: 0 0 0 4px rgba(156,145,255,.13); }.novi-boot__steps li.done { color: #a6a7b0; }.novi-boot__steps li.done .novi-boot__dot { background: #7a6ee0; }.novi-boot__foot { margin: 26px 0 0; color: #777983; font-size: 12px; line-height: 1.5; } @keyframes novi-boot-spin { to { transform: rotate(360deg); } } @keyframes novi-boot-move { 0% { transform: translateX(-105%); } 55%,100% { transform: translateX(250%); } }
    </style>
  </head>
  <body class="bg-base-950 text-base-100">
    <div id="root"><main class="novi-boot"><section class="novi-boot__card" aria-live="polite"><div class="novi-boot__brand"><span class="novi-boot__mark">✦</span>NOVI DESKTOP</div><div class="novi-boot__heading"><span class="novi-boot__spinner"></span><h1>Starting Novi</h1></div><p class="novi-boot__status">Connecting your workspace…</p><div class="novi-boot__progress"></div><ul class="novi-boot__steps"><li class="done"><i class="novi-boot__dot"></i><span>Start local services</span></li><li class="active"><i class="novi-boot__dot"></i><span>Connect your workspace</span></li><li><i class="novi-boot__dot"></i><span>Load conversations and memory</span></li></ul><p class="novi-boot__foot">Everything is running locally on your device.</p></section></main></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
